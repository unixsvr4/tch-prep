[defaults]
# Inventory: Docker target container on port 2222
inventory       = inventory/docker-hosts

# Use the demo SSH private key (generated by `make setup`)
private_key_file = demo_key

# Suppress warnings for demo environment settings
host_key_checking = False          # Skip SSH host key verification (demo container, not production)
retry_files_enabled = False        # Don't create .retry files
stdout_callback = yaml             # Cleaner output for reading
display_skipped_hosts = False

# Connection settings for Docker target
remote_user = root

[ssh_connection]
# Port 2222 on host → port 22 in container
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 2222
pipelining = True   # Faster execution: multiple commands in one SSH session
